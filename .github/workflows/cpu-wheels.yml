# Enabling candidate: root alone may publish after exact source/privacy/quota review.
# Initial push requires exact branch, repository ID and verified event.before base; no active cancellation.
name: Public Intel CPU compiler checkpoints
'on':
  workflow_dispatch:
    inputs:
      artifact_mode:
        description: Default20MiB text evidence; optional256MiB aggregate wheel sharing
        type: choice
        options:
        - none
        - evidence
        - wheels
        default: evidence
  push:
    branches:
    - ci/intel-cpu-cache-20261120-01
    paths:
    - .github/workflows/cpu-wheels.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: public-cpu-wheels-x86_64
  cancel-in-progress: false
jobs:
  cpu-wheels:
    if: ${{ github.event.repository.id == 1464218824 && github.event.repository.visibility == 'public' && github.event.repository.private == false && github.ref
      == 'refs/heads/ci/intel-cpu-cache-20261120-01' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before
      == '2800135a32db0a81b751545c948b654d03b24ffa')) }}
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      PUBLIC_REPOSITORY: ${{ github.event.repository.visibility == 'public' && github.event.repository.private == false }}
      EXPECTED_ARCH: x86_64
      ARTIFACT_MODE: ${{ github.event_name == 'push' && 'wheels' || inputs.artifact_mode || 'evidence' }}
    steps:
    - name: Check out this public recipe only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
        submodules: false
        lfs: false
    - name: Check native standard runner
      run: |
        set -euo pipefail
        umask 077
        ulimit -c 0
        test "$PUBLIC_REPOSITORY" = true
        test "$(uname -m)" = "$EXPECTED_ARCH"
        translated=$(/usr/sbin/sysctl -n sysctl.proc_translated 2>/dev/null || true)
        test "$translated" != 1
        hardware_arm=$(/usr/sbin/sysctl -n hw.optional.arm64 2>/dev/null || true)
        if test "$EXPECTED_ARCH" = x86_64 && test "$hardware_arm" = 1; then exit 1; fi
        mkdir -p "$RUNNER_TEMP/public-cpu-evidence"
    - name: Prepare pinned public compiler cache and actual toolchain key
      id: cache-key
      run: |
        set -euo pipefail
        umask 077
        python3 tools/build_cpu_wheels.py --compiler-cache prepare | tee "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-tool.json"
    - name: Restore only matching public compiler entries in normal branch scope
      id: compiler-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/public-cpu-ccache-snapshot
        key: public-cpu-ccache-v1-x86_64-${{ steps.cache-key.outputs.compiler-key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          public-cpu-ccache-v1-x86_64-${{ steps.cache-key.outputs.compiler-key }}-
    - name: Verify closed restore and load a separate writable cache
      id: cache-load
      run: |
        set -euo pipefail
        python3 tools/build_cpu_wheels.py --compiler-cache restore | tee "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-restore.json"
        "$CCACHE_EXE" --cleanup > "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-cleanup.log" 2>&1
    - name: Build or probe pinned public CPU libraries
      run: |
        set -euo pipefail
        umask 077
        ulimit -c 0
        python3 tools/build_cpu_wheels.py
      id: cpu-build
    - name: Record compiler cache statistics after controller success or failure
      if: ${{ always() && steps.cache-load.outcome == 'success' }}
      run: |
        set -euo pipefail
        "$CCACHE_EXE" --show-stats > "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-stats.txt" 2>&1
    - name: Close completed object entries into a bounded independent snapshot
      id: cache-snapshot
      if: ${{ always() && steps.cache-load.outcome == 'success' }}
      run: |
        set -euo pipefail
        python3 tools/build_cpu_wheels.py --compiler-cache snapshot | tee "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-snapshot.json"
    - name: Read actual same-repository cache usage immediately before save
      id: cache-admission
      if: ${{ always() && steps.cache-snapshot.outputs.save-ready == 'true' }}
      env:
        GH_CACHE_READ_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 tools/build_cpu_wheels.py --compiler-cache admit | tee "$RUNNER_TEMP/public-cpu-evidence/compiler-cache-admission.json"
    - name: Save only an admitted closed public compiler snapshot
      if: ${{ always() && steps.cache-snapshot.outputs.save-ready == 'true' && steps.cache-admission.outputs.save-admitted == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/public-cpu-ccache-snapshot
        key: public-cpu-ccache-v1-x86_64-${{ steps.cache-key.outputs.compiler-key }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Freeze capped shareable artifacts
      id: artifact-budget
      if: ${{ always() && inputs.artifact_mode != 'none' }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json,os,stat
        from pathlib import Path
        ok=False
        try:
            temp=Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
            evidence=temp/'public-cpu-evidence'
            wheels=temp/'public-cpu-wheels'
            target=temp/'public-cpu-artifacts'
            mode=os.environ['ARTIFACT_MODE']
            if mode not in ('evidence','wheels'): raise ValueError('Unexpected artifact mode')
            report_path=evidence/'build-report.json'
            report=json.loads(report_path.read_text()) if report_path.is_file() else {}
            share_wheels=(mode=='wheels' and report.get('passed') is True and report.get('CPUABIProbePassed') is True and len(report.get('wheels',[]))==2)
            limit=(256 if share_wheels else 20)*1024*1024
            if target.exists() or target.is_symlink(): raise ValueError('Snapshot already exists')
            target.mkdir()
            roots=[(evidence,'evidence')]+([(wheels,'wheels')] if share_wheels else [])
            total=count=0
            for root,prefix in roots:
                if root.is_symlink(): raise ValueError('Artifact source symlink')
                root.resolve(strict=True).relative_to(temp)
                for path in sorted(root.rglob('*')):
                    value=path.lstat()
                    if path.is_symlink(): raise ValueError('Artifact symlink')
                    if stat.S_ISDIR(value.st_mode): continue
                    if not stat.S_ISREG(value.st_mode): raise ValueError('Artifact special file')
                    if prefix=='wheels' and path.suffix!='.whl': raise ValueError('Only library wheels can be shared')
                    if prefix=='evidence' and path.suffix.lower() not in ('.txt','.json','.log','.md') and not path.name.upper().startswith(('LICENSE','COPYING','NOTICE')):
                        raise ValueError('Only text evidence and original license notices can be shared')
                    destination=target/prefix/path.relative_to(root)
                    destination.parent.mkdir(parents=True,exist_ok=True)
                    with path.open('rb') as source,destination.open('xb') as copied:
                        while True:
                            data=source.read(min(1024*1024,limit-total+1))
                            if not data: break
                            total+=len(data)
                            if total>limit: raise ValueError('Aggregate public artifact cap exceeded; nothing uploaded')
                            copied.write(data)
                    count+=1
            print(json.dumps({'files':count,'bytes':total,'aggregateLimitBytes':limit,'closedSnapshot':True,'mode':mode,'wheelsShared':share_wheels}))
            ok=True
        finally:
            with open(os.environ['GITHUB_OUTPUT'],'a') as stream: stream.write('within-budget='+str(ok).lower()+'\n')
        PY
    - name: Upload closed bounded public evidence
      if: ${{ always() && steps.artifact-budget.outputs.within-budget == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: public-cpu-${{ inputs.architecture || 'x86_64' }}-${{ github.run_id }}
        path: ${{ runner.temp }}/public-cpu-artifacts/
        retention-days: 1
        if-no-files-found: error
        include-hidden-files: false
